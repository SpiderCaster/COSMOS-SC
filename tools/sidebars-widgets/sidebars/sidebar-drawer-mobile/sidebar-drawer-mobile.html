<div class="sc-lay sc-drw sc-drw-{{side}}" data-sc="drawer">
<button class="sc-drw-open" type="button" aria-expanded="false" aria-controls="sc-drw-p-{{uid}}">{{open_label}}</button>
<div class="sc-lay-main">{{{main}}}</div>

<div class="sc-drw-ov" hidden></div>
</div>
