<section class="sc-w sc-tabs" data-sc="tabs" aria-label="{{title}}">
<div class="sc-tp-bar" role="tablist" aria-label="{{title}}" hidden><!--each tabs--><button class="sc-tp-tab" type="button" role="tab" id="sc-tp-b-{{key}}-{{uid}}" aria-controls="sc-tp-p-{{key}}-{{uid}}" aria-selected="false" tabindex="-1">{{label}}</button><!--/each--></div>
<!--each tabs--><div class="sc-tp-panel" id="sc-tp-p-{{key}}-{{uid}}" role="tabpanel" aria-labelledby="sc-tp-b-{{key}}-{{uid}}"><h2 class="sc-w-title sc-tp-h">{{label}}</h2><ul class="sc-list">{{{rows}}}</ul></div><!--/each-->
</section>
