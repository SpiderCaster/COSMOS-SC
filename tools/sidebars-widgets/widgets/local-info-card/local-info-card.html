<section class="sc-w sc-local" aria-labelledby="sc-lc-t-{{uid}}">
<h2 class="sc-w-title" id="sc-lc-t-{{uid}}">{{title}}</h2>
<dl class="sc-lc-l"><!--each rows--><div class="sc-lc-r"><dt>{{label}}</dt><dd>{{value}}</dd></div><!--/each--></dl>
<div class="sc-meta">Updated <time datetime="{{iso}}">{{updated}}</time></div>
<a class="sc-row sc-lc-src" href="{{source_url}}" rel="noopener">Source: {{source_label}}</a>
</section>
