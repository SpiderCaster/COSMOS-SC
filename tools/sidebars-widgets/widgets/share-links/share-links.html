<div class="sc-w sc-share" data-sc="share" data-url="{{url}}" data-ok="{{copied}}" data-fail="{{copy_failed}}" role="group" aria-labelledby="sc-sh-t-{{uid}}">
<h2 class="sc-w-title" id="sc-sh-t-{{uid}}">{{title}}</h2>
<ul class="sc-list sc-sh-l">
<li><a class="sc-chip" href="https://x.com/intent/post?url={{url_enc}}&amp;text={{text_enc}}" rel="noopener noreferrer">X</a></li>
<li><a class="sc-chip" href="https://www.facebook.com/sharer/sharer.php?u={{url_enc}}" rel="noopener noreferrer">Facebook</a></li>
<li><a class="sc-chip" href="https://www.linkedin.com/sharing/share-offsite/?url={{url_enc}}" rel="noopener noreferrer">LinkedIn</a></li>
<li><a class="sc-chip" href="mailto:?subject={{text_enc}}&amp;body={{url_enc}}">Email</a></li>
<li><button class="sc-chip sc-sh-copy" type="button">Copy link</button></li>
</ul>
<div class="sc-sh-m" role="status" aria-live="polite"></div>
</div>
