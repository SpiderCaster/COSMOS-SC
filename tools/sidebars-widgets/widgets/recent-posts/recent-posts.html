<section class="sc-w sc-recent" aria-labelledby="sc-recent-t-{{uid}}">
<h2 class="sc-w-title" id="sc-recent-t-{{uid}}">{{title}}</h2>
<ul class="sc-list"><!--each items--><li><a class="sc-row" href="{{url}}"<!--if current--> aria-current="page"<!--/if-->><span class="sc-recent-t">{{label}}</span><span class="sc-meta"><time datetime="{{iso}}">{{date}}</time></span></a></li><!--/each-->
</ul>
</section>
