<section class="sc-w sc-news-l" aria-labelledby="sc-nw-t-{{uid}}">
<h2 class="sc-w-title" id="sc-nw-t-{{uid}}">{{title}}</h2>
<ul class="sc-list"><!--each items--><li><a class="sc-row" href="{{url}}"><span class="sc-meta"><!--if tag--><strong class="sc-nw-tag">{{tag}}</strong> <!--/if--><time datetime="{{iso}}">{{time}}</time></span><span class="sc-nw-t">{{label}}</span></a></li><!--/each-->
</ul>
<!--if more_url--><a class="sc-row sc-nw-more" href="{{more_url}}">{{more_label}}</a><!--/if-->
</section>
