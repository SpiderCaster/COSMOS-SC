<section class="sc-w sc-hours" data-sc="hours" aria-labelledby="sc-hr-t-{{uid}}">
<h2 class="sc-w-title" id="sc-hr-t-{{uid}}">{{title}}</h2>
<table class="sc-hr-t"><tbody><!--each rows--><tr data-day="{{n}}"><th scope="row">{{day}}</th><td>{{hours}}</td></tr><!--/each--></tbody></table>
<!--if note--><p class="sc-body sc-hr-note">{{note}}</p><!--/if-->
</section>
