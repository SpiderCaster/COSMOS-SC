<section class="sc-w sc-sched" aria-labelledby="sc-sp-t-{{uid}}">
<h2 class="sc-w-title" id="sc-sp-t-{{uid}}">{{title}}</h2>
<div class="sc-sp-wrap"><table class="sc-sp-t"><caption class="sc-sp-c">{{caption}}</caption><thead><tr><th scope="col">Date</th><th scope="col">Opponent</th><th scope="col">Result</th></tr></thead>
<tbody><!--each rows--><tr><td><time datetime="{{iso}}">{{date}}</time></td><th scope="row">{{opponent}}<span class="sc-meta">{{where}}</span></th><td>{{result}}</td></tr><!--/each--></tbody></table></div>
</section>
