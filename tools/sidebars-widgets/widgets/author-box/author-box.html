<aside class="sc-w sc-author" aria-labelledby="sc-au-t-{{uid}}">
<h2 class="sc-w-title" id="sc-au-t-{{uid}}">{{title}}</h2>
<div class="sc-au-row"><!--if avatar--><img class="sc-au-img" src="{{avatar}}" alt="Photo of {{name}}" width="{{avatar_size}}" height="{{avatar_size}}" loading="lazy" decoding="async"><!--/if-->
<div class="sc-au-b"><p class="sc-au-n">{{name}}</p><p class="sc-body">{{bio}}</p><!--if profile_url--><a class="sc-btn" href="{{profile_url}}">{{profile_label}}</a><!--/if--></div></div>
</aside>
