<section class="sc-w sc-contact" aria-labelledby="sc-ct-t-{{uid}}">
<h2 class="sc-w-title" id="sc-ct-t-{{uid}}">{{title}}</h2>
<address class="sc-ct-a"><!--if name--><strong class="sc-ct-n">{{name}}</strong><!--/if--><!--each lines--><span class="sc-ct-line">{{line}}</span><!--/each-->
<!--if phone--><a class="sc-ct-link" href="tel:{{phone_href}}">{{phone}}</a><!--/if--><!--if email--><a class="sc-ct-link" href="mailto:{{email}}">{{email}}</a><!--/if--></address>
</section>
