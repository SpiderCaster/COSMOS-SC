<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type floor failures</title>
<style>
html{font-size:18px}
body{margin:0;background:#ffffff;color:#111111}
p{font-size:1rem}
p.note{font-size:17px}
.tag{font-size:.85rem}
.fineprint{font-size:15px}
.go{font-size:17px}
@media (max-width:600px){ .tight{font-size:.8rem} }
</style>
</head>
<body>
<main>
<p>Fine body copy.</p>
<p class="note">Seventeen pixel body copy is under the body floor.</p>
<p class="tight">Shrinks on phones only.</p>
<p style="font-size:14px">Inline fourteen pixels.</p>
<h6>Tiny heading</h6>
<button class="go" type="button">Go</button>
</main>
<footer><span class="tag">New</span> <small class="fineprint">Fifteen pixel fine print</small></footer>
</body>
</html>
