[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spidercaster"
version = "0.1.0"
description = "SpiderCaster - a copy-driven static website engine on free tokens"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - see README" }
dependencies = []

[project.scripts]
spidercaster = "spidercaster:main"

[tool.setuptools]
py-modules = ["spidercaster", "forge", "mcp_server", "antigravity_seat"]
packages = ["lib", "lib.hands", "lib.ui_hands"]

[tool.setuptools.package-data]
lib = ["ai_chain/*", "fixtures/*"]
