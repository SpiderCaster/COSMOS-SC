<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broken nav toggle fixture</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:18px/1.5 Arial,Helvetica,sans-serif;color:#111;background:#fff}
main{padding:16px;max-width:720px;margin:0 auto}
img{max-width:100%;height:auto;display:block}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid #ddd;position:relative}
.brand{font-size:20px;font-weight:700}
.nav-toggle{min-width:48px;min-height:48px;font-size:18px}
#site-nav{display:none}
#site-nav.open{display:block;position:absolute;top:64px;left:0;right:0;background:#fff;border-bottom:1px solid #ddd}
#site-nav a{display:block;min-height:48px;padding:12px 16px;font-size:18px}
@media (min-width:768px){.nav-toggle{display:none}#site-nav{display:flex}#site-nav a{display:inline-block}}
.btn{display:inline-block;min-height:48px;min-width:48px;padding:12px 20px;font-size:18px;background:#05683a;color:#fff;text-decoration:none;border-radius:6px}
</style>
</head>
<body>
<header><span class="brand">Fixture</span><button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">Menu</button>
<nav id="site-nav" aria-label="Main"><a href="#about">About</a><a href="#work">Work</a></nav></header>
<main id="main"><h1>Broken toggle page</h1>
<p>This fixture page exists only to prove one mobile gate of the SpiderCaster bench. Body copy is set at eighteen pixels.</p>
<h2 id="about">About</h2><p>The menu button here has no script, so aria-expanded never flips and the nav never opens.</p>
<h2 id="work">Work</h2><p>Third paragraph.</p>
</main>
</body>
</html>
